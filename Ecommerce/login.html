<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – HighCodeX Technologies</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Copying the exact auth styles from original */
        :root {
            --primary: #f5f0e8;
            --secondary: #ede8df;
            --accent: #8b1a1a;
            --accent-light: #b22222;
            --accent-dark: #6b0f0f;
            --text: #1a0a0a;
            --text-muted: #6b5b5b;
            --card-bg: #ffffff;
            --border: #d9cfc4;
            --navbar-bg: #1a0a0a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--primary);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .auth-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            padding: 60px 0;
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .auth-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: #1a0a0a;  /* original was white on dark, but here card is light, so adjust */
            margin-bottom: 8px;
        }
        .form-label {
            color: #6b5b5b;
            font-size: 13px;
            font-weight: 500;
        }
        .form-control {
            background: #fff;
            border: 1px solid var(--border);
            color: #1a0a0a;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 14px;
        }
        .form-control:focus {
            background: #fff;
            border-color: var(--accent);
            color: #1a0a0a;
            box-shadow: 0 0 0 3px rgba(139,26,26,0.1);
        }
        .form-control::placeholder {
            color: #aaa;
        }
        .btn-gold {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-gold:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139,26,26,0.3);
            color: #fff;
        }
    </style>
</head>
<body>
<script src="navbar.js"></script>
<div class="container auth-section">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div style="font-size:40px; margin-bottom:10px;">💻</div>
            <h2 class="auth-title">Welcome to HighCodeX</h2>
            <p style="color:#6b5b5b; font-size:14px;">Login to your account (demo)</p>
        </div>

        <!-- Demo alert (no real backend) -->
        <div id="demoAlert" style="display:none; background:rgba(139,26,26,0.08); border:1px solid var(--accent); color:var(--accent); border-radius:6px; padding:15px; margin-bottom:20px;">
            <i class="bi bi-info-circle me-2"></i> This is a demo. No actual login required.
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="demo@highcodex.com" value="demo@highcodex.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Any password" value="password" required>
            </div>
            <button type="submit" class="btn-gold w-100" style="padding:14px;">
                Login (Demo)
            </button>
        </form>

        <p class="text-center mt-4" style="color:#6b5b5b; font-size:14px;">
            Don't have an account?
            <a href="#" style="color:var(--accent); text-decoration:none;" onclick="alert('Please contact HighCodeX to get started: +91 7868946689 or highcodextech@gmail.com')">Contact us</a>
        </p>
    </div>
</div>

<script>
    function handleLogin() {
        const email = document.getElementById('email').value;
        // Show success alert with HighCodeX contact info
        alert(`Demo login successful!\n\nWelcome back, ${email}.\n\nHighCodeX Technologies\n📞 +91 7868946689\n✉️ highcodextech@gmail.com\n🌐 Chennai, Tamil Nadu\n\n(This is a frontend demo – no actual authentication.)`);
        // Optionally redirect: window.location.href = "/dashboard";
    }
</script>

</body>
</html>
